name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build web
        run: npm run build -w @mindtier/web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Export app for web (QA hooks on)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_QA_HOOKS: '1'
        run: npx expo export --platform web --output-dir ../../.qa-web
      - name: Play the core loop end to end
        run: node scripts/e2e-flow.mjs --dist .qa-web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .qa-web-e2e
          # The folder name starts with a dot; v4 skips hidden paths unless told otherwise.
          include-hidden-files: true
